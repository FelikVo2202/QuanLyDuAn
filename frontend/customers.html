<body>
<div class="app">
 <!-- SIDEBAR -->

<!-- MODAL ADD/EDIT -->

    <h3 id="modalTitle">Add New Customer</h3>
    <input type="hidden" id="editId">
    <label>First Name *</label>
    <input type="text" id="firstName" placeholder="First name">
    <label>Last Name *</label>

    <label>Phone *</label>
    <input type="text" id="phone" placeholder="Phone number">
    <label>Email (Optional)</label>
    <input type="email" id="email" placeholder="Email">

<script>
// ========== KIỂM TRA ĐĂNG NHẬP ==========
const userStr = localStorage.getItem('salonUser') || sessionStorage.getItem('salonUser');
if (!userStr) {
  window.location.href = 'login.html';
}
const userData = JSON.parse(userStr);

// Populate topbar user info (avatar, name, role)
(function populateTopbarUser() {
  try {
    const userNameEl = document.getElementById('userName');
    const userRoleEl = document.getElementById('userRole');
    const avatarEl = document.querySelector('.stylist-avatar');
    if (userNameEl) userNameEl.innerText = userData.username || userData.userName || userData.name || 'User';
    if (userRoleEl) {
      const r = userData.role || '';
      userRoleEl.innerText = r ? (r.charAt(0).toUpperCase() + r.slice(1).toLowerCase()) : '';
    }
    if (avatarEl) {
      avatarEl.textContent = userData.avatarEmoji || userData.avatar || (userData.username ? userData.username.charAt(0).toUpperCase() : '👩');
    }
  } catch (e) {
    console.error('Could not populate topbar user info', e);
  }
})();

async function logout(event) {
  if (event) event.preventDefault();

  if (!confirm('Bạn có chắc chắn muốn đăng xuất khỏi hệ thống?')) {
    return;
  }
  localStorage.removeItem('salonUser');
  sessionStorage.removeItem('salonUser');
  window.location.href = 'login.html';
}
// ========================================
// Cập nhật link dashboard theo role
const userRole = JSON.parse(localStorage.getItem('salonUser') || sessionStorage.getItem('salonUser')).role;
const dashboardLink = document.querySelector('.sidebar a[href*="dashboard"]');
if (dashboardLink) {
  if (userRole === 'MANAGER') dashboardLink.href = 'dashboard.html';
  else if (userRole === 'STYLIST') dashboardLink.href = 'dashboard_stylist.html';
  else dashboardLink.href = 'dashboard_receptionist.html';
}
// ========== DỮ LIỆU KHÁCH HÀNG ==========
const API_BASE_URL = 'http://localhost:8080/api';

function getAuthHeaders() {
  const userStr = localStorage.getItem('salonUser') || sessionStorage.getItem('salonUser');
  if (!userStr) {
    window.location.href = 'login.html';
    return null;
  }
  const user = JSON.parse(userStr);
  return {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${user.token}`
  };
}

let customers = [];

// Load từ API
async function loadCustomers() {
  const headers = getAuthHeaders();
  if (!headers) return;

  try {
    const response = await fetch(`${API_BASE_URL}/customers`, { headers });
    if (response.ok) {
      const data = await response.json();
      // Map backend phoneNumber to frontend phone
      customers = data.map(c => ({
        ...c,
        phone: c.phoneNumber
      }));
      renderCustomersWithFilters();
    } else if (response.status === 401) {
      window.location.href = 'login.html';
    } else {
      console.error('Failed to load customers');
    }
  } catch (error) {
    console.error('Error loading customers:', error);
  }
}

// MODAL
const modal = document.getElementById('customerModal');

function openAddModal() {
  document.getElementById('modalTitle').innerText = 'Add New Customer';
  document.getElementById('editId').value = '';
  document.getElementById('firstName').value = '';
  document.getElementById('lastName').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('email').value = '';
  document.getElementById('gender').value = 'Female';
  modal.classList.remove('hidden');
}

function openEditModal(id) {
  const customer = customers.find(c => c.id === id);
  if (!customer) return;
  document.getElementById('modalTitle').innerText = 'Edit Customer';
  document.getElementById('editId').value = customer.id;
  document.getElementById('firstName').value = customer.firstName;
  document.getElementById('lastName').value = customer.lastName;
  document.getElementById('phone').value = customer.phone;
  document.getElementById('email').value = customer.email || '';
  document.getElementById('gender').value = customer.gender;
  modal.classList.remove('hidden');
}

function closeModal() {
  modal.classList.add('hidden');
}

async function saveCustomer() {
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const gender = document.getElementById('gender').value;
  
  if (!firstName || !lastName || !phone) {
    alert('Please enter First Name, Last Name and Phone');
    return;
  }
  
  const headers = getAuthHeaders();
  if (!headers) return;

  const editId = document.getElementById('editId').value;
  const url = editId ? `${API_BASE_URL}/customers/${editId}` : `${API_BASE_URL}/customers`;
  const method = editId ? 'PUT' : 'POST';
  
  const payload = {
    firstName,
    lastName,
    phoneNumber: phone,
    email: email || null,
    gender
  };

  try {
    const response = await fetch(url, {
      method,
      headers,
      body: JSON.stringify(payload)
    });

    if (response.ok) {
      await loadCustomers();
      closeModal();
    } else {
      const errorData = await response.json();
      alert('Error: ' + (errorData.message || 'Cannot save customer'));
    }
  } catch (error) {
    console.error('Error saving customer:', error);
    alert('Server connection error');
  }
}

async function deleteCustomer(id) {
  if (!confirm('Are you sure you want to delete this customer?')) return;

  const headers = getAuthHeaders();
  if (!headers) return;

  try {
    const response = await fetch(`${API_BASE_URL}/customers/${id}`, {
      method: 'DELETE',
      headers
    });

    if (response.ok) {
      await loadCustomers();
    } else {
      alert('Cannot delete customer');
    }
  } catch (error) {
    console.error('Error deleting customer:', error);
    alert('Server connection error');
  }
}

async function deleteSelectedCustomers() {
  const selectedIds = getSelectedCustomerIds();
  
  if (selectedIds.length === 0) {
    alert('Please select at least one customer to delete.');
    return;
  }
  
  if (confirm(`Are you sure you want to delete ${selectedIds.length} selected customers?`)) {
    const headers = getAuthHeaders();
    if (!headers) return;

    try {
      for (const id of selectedIds) {
        await fetch(`${API_BASE_URL}/customers/${id}`, {
          method: 'DELETE',
          headers
        });
      }
      await loadCustomers();
    } catch (error) {
      console.error('Error deleting customers:', error);
      alert('Error during customer deletion');
    }
  }
}

// Khởi tạo
loadCustomers();
// ========== FILTER (hiển thị hộp thoại lọc nhanh) ==========
function openFilterModal() {
  // Tạo một prompt đơn giản để lọc theo giới tính (có thể nâng cao sau)
  let filterGender = prompt("Filter by gender:\nEnter: Male, Female, Other or leave empty to remove filter", "");
  if (filterGender !== null) {
    if (filterGender.trim() === "") {
      // Xóa filter: lưu lại biến toàn cục filterGenderValue
      window.currentFilterGender = "";
    } else {
      let genderVal = filterGender.trim();
      if (genderVal === "Male" || genderVal === "Female" || genderVal === "Other") {
        window.currentFilterGender = genderVal;
      } else {
        alert("Only accepts: Male, Female, Other");
        return;
      }
    }
    // Gọi lại render với filter mới
    renderCustomersWithFilters();
  }
}

// Biến lưu filter giới tính
window.currentFilterGender = "";

// Hàm render có tích hợp filter và search
function renderCustomersWithFilters() {
  const searchText = document.getElementById('searchInput').value;
  let filtered = [...customers];
  
  // Lọc theo search
  if (searchText) {
    const search = searchText.toLowerCase();
    filtered = filtered.filter(c => 
      c.firstName.toLowerCase().includes(search) ||
      c.lastName.toLowerCase().includes(search) ||
      c.phone.includes(search) ||
      (c.email && c.email.toLowerCase().includes(search)) ||
      c.id.toString().includes(search)
    );
  }
  
  // Lọc theo giới tính nếu có
  if (window.currentFilterGender) {
    filtered = filtered.filter(c => c.gender === window.currentFilterGender);
  }
  
  // Render bảng
  renderCustomersTable(filtered);
}

// Hàm render bảng riêng để tái sử dụng
function renderCustomersTable(filtered) {
  const container = document.getElementById('customersTable');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state">✨ No customers found. Click "Add Customer" to create one.</div>';
    return;
  }
  
  const html = `
    <table class="customers-table">
      <thead>
        <tr>
          <th class="checkbox-cell"><input type="checkbox" class="select-checkbox" onchange="toggleSelectAllFromHeader()" id="selectAllHeader"></th>
          <th>ID</th>
          <th>Full Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Gender</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${filtered.map((c, index) => `
          <tr>
            <td class="checkbox-cell">
              <input type="checkbox" class="customer-checkbox select-checkbox" data-id="${c.id}" onchange="updateDeleteButtonState()">
            </td>
            <td>${c.id}</td>
            <td><strong>${c.firstName} ${c.lastName}</strong></td>
            <td>${c.phone}</td>
            <td>${c.email || '—'}</td>
            <td><span class="gender-badge ${c.gender === 'Male' ? 'gender-male' : c.gender === 'Female' ? 'gender-female' : 'gender-other'}">${c.gender}</span></td>
            <td>
              <button class="action-btn edit-btn" onclick="openEditModal(${c.id})"><img src="assets/icons/edit.svg" width="24" height="24" alt=""></button>
              <button class="action-btn delete-btn" onclick="deleteCustomer(${c.id})"><img src="assets/icons/bin.svg" width="24" height="24" alt=""></button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    
    <div class="select-all-row">
      <label>
        
      </label>
      <button id="deleteSelectedBtn" class="delete-selected-btn" onclick="deleteSelectedCustomers()" disabled><img src="assets/icons/bin.svg" width="24" height="24" alt=""> Delete Selected</button>
    </div>
  `;
  container.innerHTML = html;
}

// Ghi đè hàm filterCustomers cũ
function filterCustomers() {
  renderCustomersWithFilters();
}

// Ghi đè renderCustomers ban đầu
function renderCustomers() {
  renderCustomersWithFilters();
}

// ========== EXPORT CSV ==========
function exportCustomersToCSV() {
  // Lấy dữ liệu đang hiển thị (đã qua filter + search)
  const searchText = document.getElementById('searchInput').value;
  let dataToExport = [...customers];
  
  if (searchText) {
    const search = searchText.toLowerCase();
    dataToExport = dataToExport.filter(c => 
      c.firstName.toLowerCase().includes(search) ||
      c.lastName.toLowerCase().includes(search) ||
      c.phone.includes(search) ||
      (c.email && c.email.toLowerCase().includes(search))
    );
  }
  if (window.currentFilterGender) {
    dataToExport = dataToExport.filter(c => c.gender === window.currentFilterGender);
  }
  
  if (dataToExport.length === 0) {
    alert("No data to export!");
    return;
  }
  
  // Tạo nội dung CSV
  let csvRows = [];
  // Header
  csvRows.push(["ID", "First Name", "Last Name", "Phone", "Email", "Gender"]);
  
  for (const c of dataToExport) {
    csvRows.push([
      c.id,
      c.firstName,
      c.lastName,
      c.phone,
      c.email || "",
      c.gender
    ]);
  }
  
  const csvContent = csvRows.map(row => row.join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.setAttribute("download", "customers_export.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ========== SELECT CHECKBOX ==========
function toggleSelectAll() {
  const selectAll = document.getElementById('selectAllCheckbox');
  const selectAllHeader = document.getElementById('selectAllHeader');
  const checkboxes = document.querySelectorAll('.customer-checkbox');
  const isChecked = selectAll.checked;
  
  checkboxes.forEach(cb => {
    cb.checked = isChecked;
  });
  
  if (selectAllHeader) selectAllHeader.checked = isChecked;
  updateDeleteButtonState();
}

function toggleSelectAllFromHeader() {
  const selectAllHeader = document.getElementById('selectAllHeader');
  const selectAll = document.getElementById('selectAllCheckbox');
  const checkboxes = document.querySelectorAll('.customer-checkbox');
  const isChecked = selectAllHeader.checked;
  
  checkboxes.forEach(cb => {
    cb.checked = isChecked;
  });
  
  if (selectAll) selectAll.checked = isChecked;
  updateDeleteButtonState();
}

function updateDeleteButtonState() {
  const checkboxes = document.querySelectorAll('.customer-checkbox');
  const checkedBoxes = document.querySelectorAll('.customer-checkbox:checked');
  const deleteBtn = document.getElementById('deleteSelectedBtn');
  
  if (deleteBtn) {
    if (checkedBoxes.length > 0) {
      deleteBtn.disabled = false;
      deleteBtn.classList.remove('disabled');
    } else {
      deleteBtn.disabled = true;
      deleteBtn.classList.add('disabled');
    }
  }
  
  // Cập nhật trạng thái của Select All
  const selectAll = document.getElementById('selectAllCheckbox');
  const selectAllHeader = document.getElementById('selectAllHeader');
  if (selectAll && checkboxes.length > 0) {
    const allChecked = checkboxes.length === checkedBoxes.length;
    selectAll.checked = allChecked;
    if (selectAllHeader) selectAllHeader.checked = allChecked;
  }
}

function getSelectedCustomerIds() {
  const checkedBoxes = document.querySelectorAll('.customer-checkbox:checked');
  return Array.from(checkedBoxes).map(cb => parseInt(cb.getAttribute('data-id')));
}

function deleteSelectedCustomers() {
  const selectedIds = getSelectedCustomerIds();
  
  if (selectedIds.length === 0) {
    alert('Please select at least one customer to delete.');
    return;
  }
  
  if (confirm(`Are you sure you want to delete ${selectedIds.length} selected customers?`)) {
    customers = customers.filter(c => !selectedIds.includes(c.id));
    // Cập nhật lại ID cho tất cả khách hàng còn lại
    reindexCustomerIds();
    saveToLocal();
    renderCustomersWithFilters();
  }
}
// Cập nhật lại ID cho tất cả khách hàng (đánh số lại từ 1)
function reindexCustomerIds() {
  customers.forEach((customer, index) => {
    customer.id = index + 1;
  });
  // Cập nhật lại nextId
  nextId = customers.length + 1;
}
