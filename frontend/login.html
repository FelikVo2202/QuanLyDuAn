<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GOUTSALON</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #fff6eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      display: flex;
      max-width: 1000px;
      width: 100%;
      background: rgb(41, 5, 5);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* LEFT SIDE - BRANDING */
    .login-brand {
      flex: 1;
      background: #fae3c8;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #36291a;;
    }
    .logo span {
      color: rgb(255, 182, 47);
    }

    .brand-text h2 {
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 12px;
    }
    .brand-text p {
      font-size: 14px;
      color: #a0a0a0;
      line-height: 1.5;
    }

    .brand-features {
      margin-top: 40px;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: #d0d0d0;
      font-size: 13px;
    }
    .feature-icon {
      width: 32px;
      height: 32px;
      background: #3b3b3b;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* RIGHT SIDE - LOGIN FORM */
    .login-form {
      flex: 1;
      padding: 48px;
      background: white;
    }

    .form-header {
      margin-bottom: 32px;
    }
    .form-header h3 {
      font-size: 24px;
      font-weight: 700;
      color: #31231a;
      margin-bottom: 8px;
    }
    .form-header p {
      font-size: 13px;
      color: #888;
    }

    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s;
      outline: none;
    }
    .input-group input:focus {
      border-color: #eab308;
      box-shadow: 0 0 0 3px #eab30820;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666666;
    }
    .forgot {
      color: #eab308;
      text-decoration: none;
      font-weight: 500;
    }
    .forgot:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #eab308;
      border: none;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .login-btn:hover {
      background: #d4a000;
      transform: translateY(-1px);
    }

    .demo-accounts {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
    }
    .demo-title {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .demo-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .demo-btn {
      padding: 8px 16px;
      background: #f5f5f5;
      border: none;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .demo-btn:hover {
      background: #eab30820;
    }

    .error-message {
      background: #fef2f2;
      color: #ef4444;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }
      .login-brand {
        padding: 32px;
      }
      .login-form {
        padding: 32px;
      }
    }
  </style>
</head>
<body>
<div class="login-container">
  <!-- LEFT BRANDING -->
  <div class="login-brand">
    <div class="logo">GOUTSALON<span>✦</span></div>
    <div class="brand-text">
      <h2>Welcome back!</h2>
      <p>Manage your salon, track appointments, and grow your business with ease.</p>
    </div>
    
  </div>

  <!-- RIGHT LOGIN FORM -->
  <div class="login-form">
    <div class="form-header">
      <h3>Login</h3>
      <p>Enter username and password</p>
    </div>

    <div id="errorMsg" class="error-message"></div>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" autocomplete="off">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Password">
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox" id="remember"> Remember me
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button class="login-btn" onclick="handleLogin()">Login →</button>
  </div>
<script>
  // API URL
  const API_BASE_URL = 'http://localhost:8080/api';

  // Hàm xử lý đăng nhập
  async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMsg');
    const remember = document.getElementById('remember').checked;

    // Kiểm tra nhập liệu
    if (!username || !password) {
      showError('Please enter both username and password');
      return;
    }

    try {
      const response = await fetch(`${API_BASE_URL}/auth/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (response.ok) {
        // Đăng nhập thành công
        errorDiv.style.display = 'none';
        
        // Mapping role to redirect page
        let redirect = 'dashboard.html';
        const role = data.staff.role; // MANAGER, RECEPTIONIST, STYLIST
        if (role === 'STYLIST') redirect = 'dashboard_stylist.html';
        else if (role === 'RECEPTIONIST') redirect = 'dashboard_receptionist.html';
        else if (role === 'MANAGER') redirect = 'dashboard.html';

        // Lưu thông tin user và token
        const userData = {
          username: data.staff.username,
          role: role,
          token: data.accessToken,
          loginTime: new Date().toISOString()
        };
        
        console.log('Login successful. Token:', data.accessToken);
        console.log('Storing userData:', userData);
        
        if (remember) {
          localStorage.setItem('salonUser', JSON.stringify(userData));
          sessionStorage.removeItem('salonUser');
          console.log('Stored in localStorage');
        } else {
          sessionStorage.setItem('salonUser', JSON.stringify(userData));
          localStorage.removeItem('salonUser');
          console.log('Stored in sessionStorage');
        }
        
        // Chuyển hướng
        alert(`Welcome back ${userData.username}`);
        window.location.href = redirect;
      } else {
        showError(data.message || '❌ Invalid username or password');
      }
    } catch (error) {
      console.error('Login error:', error);
      showError('❌ Could not connect to server');
    }
  }

  // Hiển thị lỗi
  function showError(message) {
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    
    // Tự ẩn sau 3 giây
    setTimeout(() => {
      errorDiv.style.display = 'none';
    }, 3000);
  }

  // Điền demo
  function fillDemo(username, password) {
    document.getElementById('username').value = username;
    document.getElementById('password').value = password;
  }

  // Kiểm tra nếu đã đăng nhập trước đó
  function checkAutoLogin() {
    const savedUser = localStorage.getItem('salonUser') || sessionStorage.getItem('salonUser');
    if (savedUser) {
      const user = JSON.parse(savedUser);
      // Có thể tự động chuyển hướng, nhưng để an toàn thì không auto
      console.log('Previous login session found:', user.username);
    }
  }

  // Enter để đăng nhập
  document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      handleLogin();
    }
  });
  document.getElementById('username').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      handleLogin();
    }
  });

  checkAutoLogin();
</script>
</body>
</html>
